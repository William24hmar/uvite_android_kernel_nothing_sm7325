name: Neutrino

on:
  workflow_dispatch:  # Start only manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential flex git \
            clang-14 lld-14 llvm-14 llvm-14-dev \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            binutils-aarch64-linux-gnu \
            libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler cpio zip unzip \
            liblz4-tool zstd python3 \
            default-jre openjdk-21-jdk e2fsprogs
          for tool in nm ar objcopy objdump strip readelf dis; do
            sudo ln -sf /usr/bin/llvm-$tool-14 /usr/local/bin/llvm-$tool 2>/dev/null || true
          done
          sudo ln -sf /usr/bin/clang-14  /usr/local/bin/clang  2>/dev/null || true
          sudo ln -sf /usr/bin/ld.lld-14 /usr/local/bin/ld.lld 2>/dev/null || true
          echo "clang: $(clang --version | head -1)"
          echo "llvm-nm: $(llvm-nm --version | head -1)"

      - name: Make build.sh executable
        run: chmod +x build.sh

      - name: Run build.sh
        run: ./build.sh
        env:
          # Force modpost to treat namespace warnings as non-fatal
          KBUILD_MODPOST_WARN: 1

      - name: Copy built artifacts into accessible directory
        run: |
          mkdir -p artifacts
          find "$(dirname $GITHUB_WORKSPACE)" -name "*.zip" -not -path "*/.git/*" 2>/dev/null | while read f; do
            echo "Found ZIP: $f"
            cp "$f" artifacts/
          done
          echo "--- artifacts/ contents ---"
          ls -lh artifacts/ || echo "artifacts/ is empty"

      - name: Upload ZIP files as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neutrino-zip
          path: artifacts/*.zip
          if-no-files-found: warn

          
