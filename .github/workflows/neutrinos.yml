name: Neutrino

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow files (build.sh etc.)
        uses: actions/checkout@v4

      - name: Checkout kernel source (Nothing Phone 1 — AAOSPA-VX)
        uses: actions/checkout@v4
        with:
          repository: William24hmar/uvite_android_kernel_nothing_sm7325
          ref: AAOSPA-VX
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            aria2 \
            bc bison build-essential flex git wget curl xz-utils \
            libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler cpio zip unzip \
            liblz4-tool zstd python3 \
            default-jre openjdk-21-jdk \
            e2fsprogs binutils make \
            gcc g++
          echo "HOME is: $HOME"
          echo "aria2c version: $(aria2c --version | head -1)"
          echo "gcc version: $(gcc --version | head -1)"

      - name: Copy build.sh into kernel source
        run: cp build.sh kernel/build.sh

      - name: Make build.sh executable
        working-directory: kernel
        run: chmod +x build.sh

      - name: Run build.sh
        working-directory: kernel
        run: ./build.sh
        env:
          KBUILD_BUILD_USER: William24hmar
          KBUILD_BUILD_HOST: GitHub-Actions
          KBUILD_MODPOST_WARN: 1

      - name: Collect built artifacts
        run: |
          mkdir -p artifacts
          find "${{ github.workspace }}/kernel/out" -name "*.zip" 2>/dev/null | while read f; do
            echo "Found ZIP: $f"
            cp "$f" artifacts/
          done
          echo "--- artifacts/ ---"
          ls -lh artifacts/ || echo "artifacts/ is empty"

      - name: Upload ZIP as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neutrino-NothingPhone1-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: warn
          
