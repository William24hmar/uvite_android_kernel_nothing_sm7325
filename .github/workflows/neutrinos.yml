name: Neutrino

on:
  workflow_dispatch:  # Start only manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout workflow files (build.sh etc.)
        uses: actions/checkout@v4

      - name: Checkout kernel source (Nothing Phone 1 — AAOSPA-VX)
        uses: actions/checkout@v4
        with:
          repository: William24hmar/uvite_android_kernel_nothing_sm7325
          ref: AAOSPA-VX
          path: kernel
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            bc bison build-essential flex git wget curl xz-utils \
            libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler cpio zip unzip \
            liblz4-tool zstd python3 \
            default-jre openjdk-21-jdk e2fsprogs \
            binutils make
          # clang/lld/llvm come from Snapdragon Clang 19 (downloaded by build.sh)
          echo "HOME is: $HOME"
          echo "Toolchains will land at: $HOME/toolchains/"

      - name: Copy build.sh into kernel source
        run: cp build.sh kernel/build.sh

      - name: Make build.sh executable
        working-directory: kernel
        run: chmod +x build.sh

      - name: Run build.sh
        working-directory: kernel
        run: ./build.sh
        env:
          # Non-interactive: build.sh read -t timeouts auto-select defaults
          KBUILD_BUILD_USER: William24hmar
          KBUILD_BUILD_HOST: GitHub-Actions
          # Treat namespace warnings as non-fatal
          KBUILD_MODPOST_WARN: 1

      - name: Collect built artifacts
        run: |
          mkdir -p artifacts
          echo "Searching for ZIPs under $HOME ..."
          find "$HOME" -name "*.zip" \
            -not -path "*/.git/*" \
            -not -path "*/toolchains/*" 2>/dev/null | while read f; do
            echo "Found ZIP: $f"
            cp "$f" artifacts/
          done
          echo "--- artifacts/ contents ---"
          ls -lh artifacts/ || echo "artifacts/ is empty"

      - name: Upload ZIP as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neutrino-NothingPhone1-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: warn
          
