name: Neutrino — ZenMaxBuilder

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout kernel source ─────────────────────────────────────────
      - name: Checkout kernel source (Nothing Phone 1 — AAOSPA-VX)
        uses: actions/checkout@v4
        with:
          repository: William24hmar/uvite_android_kernel_nothing_sm7325
          ref: AAOSPA-VX
          path: kernel
          fetch-depth: 1

      # ── 2. Install system dependencies ────────────────────────────────────
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            aria2 expect \
            bc bison build-essential flex git wget curl \
            xz-utils libssl-dev libelf-dev zlib1g-dev \
            device-tree-compiler cpio zip unzip \
            liblz4-tool zstd python3 \
            default-jre openjdk-21-jdk \
            e2fsprogs binutils make gcc g++ \
            cmake automake autoconf llvm lld lldb clang \
            libncurses5-dev gperf gawk perl openssl jq sed tar

      # ── 3. Clone ZenMaxBuilder ────────────────────────────────────────────
      - name: Clone ZenMaxBuilder
        run: |
          git clone --depth=1 \
            https://github.com/William24hmar/ZenMaxBuilder.git \
            -b zmb \
            $HOME/ZenMaxBuilder

      # ── 4. Download EVA GCC into ZMB toolchains/ ─────────────────────────
      #
      #  settings.cfg defines:
      #    EVA_ARM64_DIR="eva-arm64"   → toolchains/eva-arm64/
      #    EVA_ARM64_CHECK="eva-arm64/bin/aarch64-elf-gcc"
      #    EVA_ARM_DIR="eva-arm"       → toolchains/eva-arm/
      #    EVA_ARM_CHECK="eva-arm/bin/arm-eabi-gcc"
      #
      #  EVA GCC archives extract flat: gcc-arm64/ and gcc-arm/
      #  We rename them to match what ZMB expects.
      - name: Download and extract EVA GCC
        run: |
          EVA_RELEASE="22052025"
          EVA_URL="https://github.com/mvaisakh/gcc-build/releases/download/${EVA_RELEASE}"
          TLDR="$HOME/ZenMaxBuilder/toolchains"
          mkdir -p "$TLDR"

          # arm64 → eva-arm64/
          echo "Downloading EVA GCC arm64..."
          aria2c -x 16 -s 16 --console-log-level=warn \
            -d "$TLDR" -o "eva-gcc-arm64.xz" \
            "${EVA_URL}/eva-gcc-arm64-${EVA_RELEASE}.xz"
          tar xf "$TLDR/eva-gcc-arm64.xz" -C "$TLDR"
          mv "$TLDR/gcc-arm64" "$TLDR/eva-arm64"
          rm  "$TLDR/eva-gcc-arm64.xz"

          # arm32 → eva-arm/
          echo "Downloading EVA GCC arm32..."
          aria2c -x 16 -s 16 --console-log-level=warn \
            -d "$TLDR" -o "eva-gcc-arm.xz" \
            "${EVA_URL}/eva-gcc-arm-${EVA_RELEASE}.xz"
          tar xf "$TLDR/eva-gcc-arm.xz" -C "$TLDR"
          mv "$TLDR/gcc-arm" "$TLDR/eva-arm"
          rm  "$TLDR/eva-gcc-arm.xz"

          echo "── Toolchain check ──"
          "$TLDR/eva-arm64/bin/aarch64-elf-gcc" --version | head -1
          "$TLDR/eva-arm/bin/arm-eabi-gcc"      --version | head -1

      # ── 5. Patch settings.cfg ─────────────────────────────────────────────
      #
      #  We edit settings.cfg directly (no separate user.cfg needed).
      #  Changes made:
      #
      #  a) CODENAME / KERNEL_DIR / COMPILER — stop ZMB from asking
      #  b) ARCH, PLATFORM_VERSION, ANDROID_MAJOR_VERSION for SM7325/Android 11
      #  c) BUILDER / HOST — build identity
      #  d) INCLUDED — files to pack into the flashable ZIP
      #  e) EVA_GCC_OPTIONS — fix HOSTCC/HOSTCXX (ZMB default sets them to
      #     aarch64-elf-gcc which has no host sysroot → C23 bool/false error).
      #     Override to native gcc + add HOSTCFLAGS=-std=gnu11
      #  f) Append extra MAKE_FLAGS for GCC_LTO, GRAPHITE, CC_COMPAT, Werror
      - name: Patch ZMB settings.cfg
        run: |
          CFG="$HOME/ZenMaxBuilder/etc/settings.cfg"
          KERNEL_ABS="${{ github.workspace }}/kernel"
          GCC32="$HOME/ZenMaxBuilder/toolchains/eva-arm"

          # ── a) Device / compiler answers ──────────────────────────────────
          sed -i "s|CODENAME=\"default\"|CODENAME=\"phone1\"|"         "$CFG"
          sed -i "s|KERNEL_DIR=\"default\"|KERNEL_DIR=\"${KERNEL_ABS}\"|" "$CFG"
          sed -i "s|COMPILER=\"default\"|COMPILER=\"Eva-GCC\"|"        "$CFG"

          # ── b) Android version (SM7325 ships Android 11 = 'r') ───────────
          sed -i "s|PLATFORM_VERSION=\"10\"|PLATFORM_VERSION=\"11\"|"  "$CFG"
          sed -i "s|ANDROID_MAJOR_VERSION=\"q\"|ANDROID_MAJOR_VERSION=\"r\"|" "$CFG"

          # ── c) Build identity ─────────────────────────────────────────────
          sed -i "s|BUILDER=\"default\"|BUILDER=\"William24hmar\"|"    "$CFG"
          sed -i "s|HOST=\"default\"|HOST=\"GitHub-Actions\"|"         "$CFG"

          # ── d) Files to include in ZIP ────────────────────────────────────
          sed -i "s|INCLUDED=(.*)|INCLUDED=(dtbo.img)|"                "$CFG"

          # ── e) Fix EVA_GCC_OPTIONS: replace cross-compiler HOSTCC/HOSTCXX
          #       with native gcc so host scripts (fixdep etc.) compile OK.
          #       Also add HOSTCFLAGS=-std=gnu11 to fix Ubuntu GCC14 C23 error:
          #         stddef.h: 'false' cannot be used as enumeration constant
          #         types.h:  'bool' cannot be defined via 'typedef'
          python3 - "$CFG" << PYEOF
          import re, sys
          path = sys.argv[1]
          txt  = open(path).read()

          # Replace HOSTCC and HOSTCXX inside EVA_GCC_OPTIONS block
          txt = txt.replace(
              '  HOSTCC="aarch64-elf-gcc"',
              '  HOSTCC="gcc"')
          txt = txt.replace(
              '  HOSTCXX="aarch64-elf-g++"',
              '  HOSTCXX="g++"')

          # Insert HOSTCFLAGS and HOSTCXXFLAGS after HOSTAR line in EVA block
          txt = txt.replace(
              '  HOSTAR="aarch64-elf-ar")',
              '  HOSTAR="aarch64-elf-ar"\n  HOSTCFLAGS="-std=gnu11"\n  HOSTCXXFLAGS="-std=gnu++11")')

          open(path, 'w').write(txt)
          print("EVA_GCC_OPTIONS patched OK")
          PYEOF

          # ── f) Append extra flags after settings.cfg ─────────────────────
          #  GCC_LTO / GRAPHITE — EVA GCC optimisation flags
          #  CC_COMPAT         — arm32 compat compiler (ZMB only passes
          #                      CROSS_COMPILE_ARM32, not CC_COMPAT)
          #  HOSTLD=ld         — ensure host linker is native
          #  Wno-error flags   — suppress vendor driver pre-existing bugs:
          #    cnss2/bus.c:31     incompatible-pointer-types
          #    nfc_i2c_drv.c:76   format= and implicit-fallthrough
          cat >> "$CFG" << EXTRA

          # ── Extra flags injected by neutrinos.yml ─────────────────────────
          EXTRA_MAKE_FLAGS=(
            "GCC_LTO=1"
            "GRAPHITE=1"
            "CC_COMPAT=${GCC32}/bin/arm-eabi-gcc"
            "HOSTLD=ld"
            "KBUILD_CFLAGS+=-Wno-error=incompatible-pointer-types -Wno-error=format= -Wno-error=implicit-fallthrough"
          )
          EXTRA

          echo "── Final relevant settings ──"
          grep -E "CODENAME|KERNEL_DIR|COMPILER|PLATFORM|ANDROID_MAJOR|BUILDER|HOST=" "$CFG" | grep -v "#"

      # ── 6. ReSukiSU + SUSFS ───────────────────────────────────────────────
      - name: Integrate ReSukiSU + SUSFS
        working-directory: kernel
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash

          DEFCONFIG="arch/arm64/configs/phone1_defconfig"
          _ensure() {
            grep -q "^${1}$" "$DEFCONFIG" 2>/dev/null \
              && echo "  already: $1" \
              || { echo "$1" >> "$DEFCONFIG"; echo "  added: $1"; }
          }
          _ensure "CONFIG_KSU=y"
          _ensure "CONFIG_KSU_SUSFS=y"
          _ensure "CONFIG_KSU_SUSFS_SUS_PATH=y"
          _ensure "CONFIG_KSU_SUSFS_SUS_MOUNT=y"
          _ensure "CONFIG_KSU_SUSFS_SUS_KSTAT=y"
          _ensure "CONFIG_KSU_SUSFS_SPOOF_UNAME=y"
          _ensure "CONFIG_KSU_SUSFS_ENABLE_LOG=y"
          _ensure "CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y"
          _ensure "CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y"
          _ensure "CONFIG_KSU_SUSFS_OPEN_REDIRECT=y"
          _ensure "CONFIG_KSU_SUSFS_SUS_SU=y"

      # ── 7. Run ZMB via expect ─────────────────────────────────────────────
      #
      #  Even with settings.cfg pre-filled, ZMB may still prompt for:
      #   • confirmation of kernel directory
      #   • CROSS_COMPILE Makefile patch (answer: yes)
      #   • clean build (answer: yes — fresh CI run)
      #   • AnyKernel3 install
      #  The expect script handles all of these safely.
      - name: Build kernel via ZMB
        run: |
          export PATH="$HOME/ZenMaxBuilder/toolchains/eva-arm64/bin:\
          $HOME/ZenMaxBuilder/toolchains/eva-arm/bin:$PATH"

          expect << 'EXPECT_SCRIPT'
          set timeout 3600
          log_user 1

          spawn bash -c "cd $env(HOME)/ZenMaxBuilder && bash bin/zmb --start"

          # Answer any kernel path / directory prompt
          expect -re {(kernel directory|path to kernel|KERNEL_DIR)} {
              set kdir "$env(HOME)/../work/uvite_android_kernel_nothing_sm7325/uvite_android_kernel_nothing_sm7325/kernel"
              send "$kdir\r"
              exp_continue
          }

          # CROSS_COMPILE not set / Makefile patch prompt
          expect -re {(set it up|fix Makefile|CROSS_COMPILE|answer yes)} {
              send "yes\r"
              exp_continue
          }

          # Clean build?
          expect -re {(clean|dirty|previous build)} {
              send "yes\r"
              exp_continue
          }

          # AnyKernel3 install?
          expect -re {(AnyKernel|install.*AK)} {
              send "yes\r"
              exp_continue
          }

          # Save defconfig?
          expect -re {save.*defconfig} {
              send "no\r"
              exp_continue
          }

          # Wait for ZMB to finish
          expect {
              eof { }
              timeout {
                  puts "\nERROR: ZMB timed out"
                  exit 1
              }
          }
          EXPECT_SCRIPT

      # ── 8. Collect ZIP ────────────────────────────────────────────────────
      #  ZMB outputs to: $HOME/ZenMaxBuilder/builds/<codename>/
      - name: Collect build artifacts
        run: |
          mkdir -p artifacts
          find "$HOME/ZenMaxBuilder/builds/" -name "*.zip" 2>/dev/null \
            | while read f; do
                echo "Found: $f"
                cp "$f" artifacts/
              done
          ls -lh artifacts/ || echo "WARNING: no ZIP found"

      # ── 9. Upload ─────────────────────────────────────────────────────────
      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Neutrino-NothingPhone1-ZMB-${{ github.run_number }}
          path: artifacts/*.zip
          if-no-files-found: warn
